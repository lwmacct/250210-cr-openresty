name: latest-container

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: digest-linux-amd64
            cache: buildcache-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: digest-linux-arm64
            cache: buildcache-arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Build and publish image digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/latest/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.cache }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.cache }},mode=max
          provenance: false

      - name: Smoke test image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          __main() {
            docker pull "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
            docker run --rm \
              --platform "${{ matrix.platform }}" \
              "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}" \
              openresty -t
          }

          __main

      - name: Export digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          __main() {
            local _digest

            mkdir -p /tmp/digests
            _digest="${IMAGE_DIGEST}"
            touch "/tmp/digests/${_digest#sha256:}"
          }

          __main

      - name: Upload digest
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs:
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Download digests
        uses: actions/download-artifact@v6
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Create multi-platform manifest
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          __main() {
            local _tag _digest_file
            local -a _tag_args=()
            local -a _source_args=()

            while IFS= read -r _tag; do
              _tag_args+=("-t" "$_tag")
            done < <(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")

            for _digest_file in /tmp/digests/*; do
              _source_args+=("${REGISTRY}/${IMAGE_NAME}@sha256:$(basename "$_digest_file")")
            done

            docker buildx imagetools create "${_tag_args[@]}" "${_source_args[@]}"
          }

          __main
